name: Authorized private author-history cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitize:
    if: github.event.repository.private == true && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve code and replace personal-email ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sanitize-history.py
